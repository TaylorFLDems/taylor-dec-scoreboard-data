name: Daily P13 graphic

# Renders share/p13-today.png (and a dated copy in share/daily/) from p13.json.
# Runs whenever the daily count updates p13.json, plus a fallback each morning
# so the countdown still advances on days the count does not change.

on:
  push:
    branches: [main]
    paths: ['p13.json', 'neighborhoods.json', 'share/render_daily.py', 'share/render_turnout.py', 'share/assets/**']
  schedule:
    # 14:41 UTC = 10:41 a.m. EDT (9:41 a.m. EST after Nov 1). Odd minute on
    # purpose: GitHub drops scheduled runs at :00/:30 under load.
    - cron: '41 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p13-graphic
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # Render from the newest p13.json on main, not the commit that started the
      # run. Runs are queued one at a time (concurrency above), so a later run
      # always has data at least as new as an earlier one.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright Chromium
        run: |
          pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Render
        run: python share/render_daily.py

      # Perry/county and Perry-neighborhood images from neighborhoods.json (percentages only).
      - name: Render turnout graphics
        run: python share/render_turnout.py

      - name: Commit if the image changed
        run: |
          git config user.name  "scoreboard[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add share/p13-today.png share/turnout-today.png share/perry-today.png share/daily/
          if git diff --staged --quiet; then
            echo "graphic unchanged"
            exit 0
          fi
          git commit -m "Daily graphics $(TZ=America/New_York date +%F)"
          # If an earlier run already pushed today's image, the two PNGs conflict.
          # -X theirs keeps this run's render (in a rebase, "theirs" is our commit),
          # which is the newer one. Oct 26: without it the second run failed and
          # the image stayed on the stale count.
          for i in 1 2 3; do
            git pull --rebase -X theirs --quiet && git push && exit 0
            sleep 10
          done
          exit 1
