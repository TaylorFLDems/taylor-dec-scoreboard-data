<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.tdsb{--navy:#0A3161;--navy-900:#061f3e;--navy-100:#d6e0ec;--navy-50:#eef3f9;--red:#B31942;--red-800:#99173a;--red-100:#f4d6de;
 --page:#F1F2F2;--card:#ffffff;--ink:#2D2926;--ink2:#3d3833;--ink3:#514b45;--muted:#6b645d;
 --line:#e1ddd7;--track:#ece9e4;--other:#8a847c;--ok:#1b7a4b;--ok-bg:#e4f2ea;--warnc:#8a5a12;--warn-bg:#f8efdd;
 --display:'Archivo','Arial Narrow',system-ui,sans-serif;--body:'Libre Franklin',system-ui,-apple-system,'Segoe UI',sans-serif;
 --shadow-sm:0 1px 3px rgba(10,49,97,.10),0 1px 2px rgba(10,49,97,.06);
 background:var(--page);color:var(--ink2);font-family:var(--body);
 font-size:16px;line-height:1.45;padding:16px;border-radius:10px;max-width:1080px;margin:0 auto;box-sizing:border-box;text-align:left}
.tdsb *{box-sizing:border-box;margin:0;padding:0;border:0;list-style:none;text-align:inherit;font-family:inherit;letter-spacing:normal;text-transform:none;background:none;box-shadow:none}
.tdsb .hd{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:10px;padding:22px;margin-bottom:16px}
.tdsb .hd .kick{display:inline-flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff}
.tdsb .hd .kick::before{content:"";width:22px;height:3px;background:#fff;flex-shrink:0}
.tdsb .hd h2{font-family:var(--display);font-weight:900;font-size:clamp(26px,4vw,34px);line-height:1.05;letter-spacing:-.02em;color:#fff;margin-top:10px}
.tdsb .hd p{color:rgba(255,255,255,.86);font-size:15px;line-height:1.6;margin-top:10px;max-width:62ch}
.tdsb .hd a{color:#fff;text-decoration:underline}
.tdsb .hero{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:14px}
.tdsb .hero .big{font-family:var(--display);font-size:clamp(44px,8vw,64px);font-weight:900;line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#fff}
.tdsb .hero .of{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.82);padding-bottom:6px}
.tdsb .hbar{height:10px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:14px;overflow:hidden}
.tdsb .hbar i{display:block;height:100%;background:#fff;border-radius:2px}
.tdsb .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}
.tdsb .card{background:var(--card);border-radius:10px;padding:20px 22px;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.tdsb .card h3{font-family:var(--display);font-size:17px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.04em;line-height:1.15}

.tdsb .mrow{margin-top:16px}
.tdsb .mrow .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tdsb .mrow .lab{font-size:15px;color:var(--ink2);font-weight:500}
.tdsb .mrow .val{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.01em;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}
.tdsb .mrow .val small{font-family:var(--body);font-size:14px;font-weight:500;letter-spacing:0;color:var(--muted)}
.tdsb .bar{position:relative;height:8px;background:var(--track);border-radius:2px;margin-top:8px}
.tdsb .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--navy);border-radius:2px}
.tdsb .bar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.tdsb .mrow .sub,.tdsb .card>.sub{font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.tdsb .card>.sub{margin-top:12px}
.tdsb .st{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;padding:3px 9px;border-radius:999px;margin-left:8px;white-space:nowrap;vertical-align:2px}
.tdsb .st.ok{background:var(--ok-bg);color:var(--ok)}.tdsb .st.behind{background:var(--red-100);color:var(--red-800)}.tdsb .st.wait{background:var(--track);color:var(--ink2)}
.tdsb .sec{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:-.01em;color:var(--navy);margin:26px 0 12px}
.tdsb .sec::before{content:"";width:22px;height:3px;background:var(--red);flex-shrink:0}
.tdsb .card svg{margin-top:12px}
.tdsb svg{display:block;width:100%;height:auto;max-width:none;border:0;overflow:visible}
.tdsb svg text{font-family:var(--body);fill:var(--ink3)}
.tdsb .foot{font-size:13px;color:var(--muted);margin-top:18px}
.tdsb .foot a,.tdsb details a{color:var(--navy);text-decoration:underline}
.tdsb details{margin-top:10px;font-size:13.5px;color:var(--ink3);line-height:1.6}

.tdsb details summary:focus-visible,.tdsb a:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(31,77,135,.45)}
.tdsb details p{margin-top:8px}
.tdsb .warn{background:var(--warn-bg);color:var(--warnc);border:1px solid #e9d3a6;border-left:4px solid #b8791a;border-radius:6px;padding:10px 12px;font-size:14px;margin-bottom:16px}
.tdsb table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.tdsb th,.tdsb td{padding:6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tdsb th:first-child,.tdsb td:first-child{text-align:left}
.tdsb th{color:var(--muted);font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.tdsb .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tdsb .chip{display:inline-flex;align-items:center;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}
.tdsb .chip.up{background:#fff;color:var(--navy)}
.tdsb .mbar{position:relative;margin-top:16px;padding-bottom:22px}
.tdsb .mbar .hbar{margin-top:0}
.tdsb .mbar .tick{position:absolute;top:-3px;width:2px;height:16px;background:rgba(255,255,255,.45);margin-left:-1px}

.tdsb .mbar .tick.hit span{color:#fff}
.tdsb .hd .next{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.04em;color:#fff;margin-top:6px}
.tdsb .act{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:10px;box-shadow:var(--shadow-sm);padding:20px 22px;margin-bottom:16px}
.tdsb .act h3{font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:-.01em;line-height:1.1;color:var(--navy)}
.tdsb .act p{font-size:15px;line-height:1.6;color:var(--ink2);margin-top:8px;max-width:60ch}
.tdsb .act .row{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-top:16px}
.tdsb .act a.btn{display:inline-flex;align-items:center;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--red);padding:13px 22px;border-radius:6px;text-decoration:none;transition:background 120ms cubic-bezier(.2,0,0,1),transform 120ms cubic-bezier(.2,0,0,1)}

.tdsb .act a.lnk{font-weight:600;font-size:15px;color:var(--navy);text-decoration:underline;text-underline-offset:3px}
.tdsb .vote dl{margin-top:4px}
.tdsb .vote dt{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-top:14px}
.tdsb .vote dd{font-size:15px;line-height:1.5;color:var(--ink2);margin-top:3px}
.tdsb .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:6px 9px;border-radius:6px;opacity:0;transition:opacity 120ms cubic-bezier(.2,0,0,1);z-index:5;white-space:nowrap;box-shadow:0 4px 12px rgba(10,49,97,.10)}

.tdsb .lg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:13.5px;color:var(--ink2)}
.tdsb .lg span{display:inline-flex;align-items:center;gap:6px}
.tdsb .lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.tdsb .cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tdsb .cmp div{background:var(--navy-50);border-radius:8px;padding:12px 14px}
.tdsb .cmp b{display:block;font-family:var(--display);font-size:26px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.05}
.tdsb .cmp span{display:block;font-size:13px;color:var(--ink3);margin-top:4px;line-height:1.4}

.tdsb .fr{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-sm);padding:10px 14px;margin-bottom:12px}
.tdsb .fr summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--body);font-size:15px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);list-style:none}
.tdsb .fr summary::-webkit-details-marker{display:none}
.tdsb .fr summary .more{margin-left:auto;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
.tdsb .fr[open] summary .more::after{content:" \25B4"}.tdsb .fr:not([open]) summary .more::after{content:" \25BE"}
.tdsb .fr .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;display:inline-block}
.tdsb .fr .ok{background:var(--ok)}.tdsb .fr .wait{background:#b8791a}.tdsb .fr .bad{background:var(--red)}
.tdsb .fr ul{margin-top:8px;border-top:1px solid var(--line)}
.tdsb .fr li{display:grid;grid-template-columns:11px 1fr;gap:4px 10px;align-items:baseline;padding:8px 0 2px;font-size:14px;line-height:1.5;color:var(--ink2)}
.tdsb .fr li .dot{transform:translateY(1px)}
.tdsb .fr li b{font-weight:600;color:var(--ink)}
.tdsb .fr li .fix{grid-column:2;font-size:13.5px;color:var(--ink3)}
.tdsb .fr li .fix::before{content:"Fix: ";font-weight:700;color:var(--red-800)}

.tdsb .dlg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13.5px;color:var(--ink2)}
.tdsb .dlg span{display:inline-flex;align-items:center;gap:7px}
.tdsb .dlg svg{margin:0;width:26px;height:12px}
.tdsb td small{color:var(--muted);font-size:12px}
</style>
<style>.tdsb-x{display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:1080px;margin:30px auto 6px;padding:0 16px;box-sizing:border-box}.tdsb-x span{font-family:'Archivo','Arial Narrow',system-ui,sans-serif;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6b645d;margin-right:4px}.tdsb-x a{display:inline-flex;align-items:center;font-family:'Archivo','Arial Narrow',system-ui,sans-serif;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;padding:6px 12px;border-radius:999px;border:1.5px solid #0A3161;color:#0A3161;background:transparent;text-decoration:none;transition:background 120ms cubic-bezier(.2,0,0,1),color 120ms cubic-bezier(.2,0,0,1)}.tdsb-x a:hover{background:#0A3161;color:#fff}.tdsb-x a:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(31,77,135,.45)}.tdsb-x a[aria-current]{background:#0A3161;color:#fff;cursor:default}@media (max-width:560px){.tdsb-x{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:6px;padding-bottom:2px}.tdsb-x::-webkit-scrollbar{display:none}.tdsb-x span{display:none}.tdsb-x a{flex:0 0 auto;font-size:11px;padding:6px 10px;letter-spacing:.04em}}</style>
<nav class="tdsb-x" aria-label="Scoreboard pages"><span>Scoreboards</span><a aria-current="page">County Chase</a><a href="https://www.taylorfldems.org/2026-general-p13">Precinct 13 Tracker</a><a href="https://www.taylorfldems.org/2026-general-turnout">Countywide turnout</a></nav>
<div class="tdsb" id="tdsb-a"><p style="padding:16px">Loading the scoreboard&hellip;</p></div>
<script>
(function(){
var MODE = "a", DATA = "https://raw.githubusercontent.com/TaylorFLDems/taylor-dec-scoreboard-data/main/", SHEET = "", G = {"a_ballots": 1750, "a_onfile": 475, "a_returned": 400, "a_early": 600, "a_regs": 30, "b_ballots": 600, "b_before": 250};
var root = document.getElementById('tdsb-' + MODE);
function clog(){try{var c=window.console;if(c&&typeof c.log==='function')c.log.apply(c,arguments);}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(n){return n==null||isNaN(n)?'\u2013':Number(n).toLocaleString('en-US');}
function raw(url){
  var u = url + (url.indexOf('?')<0?'?':'&') + 'cb=' + Date.now();
  var t = new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},12000);});
  var f = function(){ try { return fetch(u,{cache:'no-store'}); } catch(e){ return fetch(u); } };
  return Promise.race([f().catch(function(){return fetch(u);}), t]).then(function(r){
    if(!r.ok) throw new Error(url+' '+r.status); return r.text(); });
}
function soft(url, parse){ if(!url) return Promise.resolve(null);
  return raw(url).then(parse).catch(function(e){clog('scoreboard: optional source failed',url,String(e));return null;}); }
function csv(text){
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<text.length;i++){var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(f);rows.push(row);row=[];f=''; }
    else f+=c; }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  var h=rows.shift()||[], out={};
  rows.forEach(function(r){ var o={}; h.forEach(function(k,j){o[k.trim()]=(r[j]||'').trim();});
    if(o.key) out[o.key]={what:o.what,value:o.value===''?null:Number(o.value.replace(/,/g,'')),
      goal:o.goal===''?null:Number(o.goal.replace(/,/g,'')),as_of:o.as_of}; });
  return out;
}

/* ---- dates ---- */
function today(){ var d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function ymd(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function daysUntil(s){ return Math.round((ymd(s)-today())/864e5); }
function nice(s){ if(!s) return ''; var d=/\//.test(s)?new Date(s):ymd(s);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function prevDay(iso){ var d=ymd(iso); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }
/* Day the state posted the voter file we counted. Labels use this, not the file's
   last activity date, which lags on days the county logs no returns. */
function fileDay(x){ return x ? (x.file_date || (x.vbm_file&&x.vbm_file.file_date) || x.through) : ''; }

/* During early voting (Oct 24 to 31, plus the Nov 1 file that carries Oct 31),
   say why today's early votes are not on the board yet. Trey, Oct 23. */
function evNote(){ return (daysUntil('2026-10-24')<=0 && daysUntil('2026-11-01')>=0) ?
  ' Early votes are added the day after they are cast.' : ''; }

/* ---- pieces ---- */
function status(v, goal, dueISO, startISO){
  if(v==null) return '<span class="st wait">not reported</span>';
  if(v>=goal) return '<span class="st ok">&#10003; goal met</span>';
  if(!dueISO) return '';
  var left = daysUntil(dueISO);
  if(left<0) return '<span class="st behind">&#9888; missed</span>';
  if(startISO && daysUntil(startISO)>0) return '<span class="st wait">'+(arguments[4]||'starts '+nice(startISO))+'</span>';
  var need = Math.ceil((goal - v) / Math.max(1,left+1));
  return '<span class="st wait">'+fmt(need)+'/day to go</span>';
}
function meter(label, v, goal, sub, st){
  var w = goal ? Math.min(100, 100*(v||0)/goal) : 0;
  return '<div class="mrow"><div class="top"><span class="lab">'+esc(label)+(st||'')+'</span>'+
    '<span class="val">'+fmt(v)+(goal?' <small>of '+fmt(goal)+'</small>':'')+'</span></div>'+
    (goal?'<div class="bar" role="img" aria-label="'+esc(label)+': '+fmt(v)+' of '+fmt(goal)+'"><i style="width:'+w.toFixed(1)+'%"></i></div>':'')+
    (sub?'<div class="sub">'+sub+'</div>':'')+'</div>';
}
function sheetMeter(S, key, sub){
  var r = S && S[key]; if(!r) return '';
  var st = r.value==null ? '<span class="st wait">not reported</span>' :
           (r.goal && r.value>=r.goal ? '<span class="st ok">&#10003; goal met</span>' : '');
  return meter(r.what, r.value, r.goal, (sub||'') + (r.as_of?' As of '+esc(r.as_of)+'.':''), st);
}
function cureMeter(S, rej, cur, label, C){
  var a, b, src;
  if(C && C.cure_flagged!=null){
    a={value:C.cure_flagged}; b={value:C.cure_cured};
    src=' From the daily mail-ballot file (unsigned, voter error or mismatched signature).';
  } else {
    a=S&&S[rej]; b=S&&S[cur]; if(!a||!b) return '';
    src=b&&b.as_of?' As of '+esc(b.as_of)+'.':'';
  }
  if(!a.value) return '<div class="mrow"><div class="top"><span class="lab">'+esc(label)+'<span class="st wait">none yet</span></span><span class="val">0</span></div>'+
    '<div class="sub">Goal: every one cured by 5 p.m. Nov 5.'+src+'</div></div>';
  var c=b.value||0, st = c>=a.value ? '<span class="st ok">&#10003; all cured</span>' : '<span class="st behind">'+fmt(a.value-c)+' still open</span>';
  return meter(label+': cured', c, a.value, 'Goal: every one cured by 5 p.m. Nov 5.'+src, st);
}

/* tooltip shared by charts */
var tip;
function tipAt(svg, html, evt){
  if(!tip){ tip=document.createElement('div'); tip.className='tip'; root.style.position='relative'; root.appendChild(tip); }
  var rb=root.getBoundingClientRect(); tip.innerHTML=html; tip.style.opacity=1;
  var x=evt.clientX-rb.left+12, y=evt.clientY-rb.top-34;
  tip.style.left=Math.min(x, rb.width-tip.offsetWidth-8)+'px'; tip.style.top=y+'px';
}
function tipOff(){ if(tip) tip.style.opacity=0; }
function el(n,a){var e=document.createElementNS('http://www.w3.org/2000/svg',n);for(var k in a)e.setAttribute(k,a[k]);return e;}
function txt(x,y,s,o){o=o||{};var t=el('text',{x:x,y:y,'font-size':o.size||13,'text-anchor':o.anchor||'start'});
  if(o.weight)t.setAttribute('font-weight',o.weight); if(o.fill)t.setAttribute('style','fill:'+o.fill);
  t.textContent=s;return t;}
function widthOf(svg){ return Math.max(300, Math.min(1100, Math.round(svg.getBoundingClientRect().width||600))); }

/* Line: one actual series against a straight goal path. Single axis, count. */
function paceChart(id, pts, goal, startISO, dueISO, unit, flat){
  var svg=document.getElementById(id); if(!svg) return; svg.innerHTML='';
  if(pts.length<2){ svg.setAttribute('viewBox','0 0 600 40'); svg.appendChild(txt(0,24,'The trend line starts after the second daily update.',{fill:'var(--muted)'})); return; }
  var W=widthOf(svg), H=200, L=44, R=16, T=14, B=28;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  var t0=ymd(startISO).getTime(), t1=ymd(dueISO).getTime();
  var X=function(iso){return L+(ymd(iso).getTime()-t0)/(t1-t0)*(W-L-R);};
  var top=Math.max(goal, Math.max.apply(null,pts.map(function(p){return p.v;})));
  var mag=Math.pow(10,Math.floor(Math.log10(top/4))), step=[1,1.5,2,2.5,3,5,7.5,10].map(function(m){return m*mag;}).filter(function(x){return x*4>=top;})[0];
  var hi=step*4*1.04;
  var Y=function(v){return T+(1-v/hi)*(H-T-B);};
  for(var k=0;k<=4;k++){var v=step*k,y=Y(v);

var animated=false;
function animateIn(){
  if(animated) return; animated=true;
  try{ if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){ return; }
  if(document.hidden || !window.requestAnimationFrame) return;
  var big=root.querySelector('.hero .big[data-v]'), target=big?+big.getAttribute('data-v'):0;
  var bars=[].slice.call(root.querySelectorAll('.hbar i, .bar i')).map(function(e){return {e:e,w:e.style.width};});
  var rects=[].slice.call(root.querySelectorAll('svg rect[data-w]')).map(function(e){return {e:e,w:+e.getAttribute('data-w')};});
  bars.forEach(function(b){b.e.style.width='0%';}); rects.forEach(function(r){r.e.setAttribute('width',0);});
  var t0=null, D=800, done=false;
  /* the true values always win: finish() runs at the end of the animation, and again on a
     timer in case the browser pauses frames (background tab, covered window, power saving) */
  function finish(){ if(done) return; done=true;
    if(big && target>0) big.textContent=fmt(target); bars.forEach(function(b){b.e.style.width=b.w;}); rects.forEach(function(r){r.e.setAttribute('width',r.w);}); }
  function step(ts){ if(done) return; if(t0===null) t0=ts; var k=Math.min(1,(ts-t0)/D), e=1-Math.pow(1-k,3);
    if(big && target>0) big.textContent=fmt(Math.round(target*e));
    bars.forEach(function(b){b.e.style.width=(parseFloat(b.w)*e).toFixed(2)+'%';});
    rects.forEach(function(r){r.e.setAttribute('width',(r.w*e).toFixed(1));});
    if(k<1) requestAnimationFrame(step); else finish();
  }
  requestAnimationFrame(step); setTimeout(finish, D+300);
  document.addEventListener('visibilitychange', function(){ if(document.hidden) finish(); });
}

  return (h%12||12)+':'+m+(h<12?' a.m.':' p.m.'); }

function stateRow(L, K, team){
  var d=L.days[L.days.length-1], ours=pStamp(d.compiled), now=new Date(), hr=now.getHours()+now.getMinutes()/60;
  var weekend = now.getDay()===0 || now.getDay()===6;
  var chk = K && K.checked_at ? new Date(K.checked_at) : null;
  var fresh = chk && !isNaN(chk) && (now-chk) < 3*36e5;
  var FIX = 'Run "Daily EV/VBM pull" from the Actions tab of taylor-dec-scoreboard-data on GitHub.';
  var r = {name:'State file'};
  if(fresh && K.ok && K.behind && K.behind.county){
    r.lvl='bad'; r.msg='<b>Behind.</b> The state posted a newer file ('+esc(when(pStamp(K.state.county_compiled)))+') than this page shows ('+esc(when(ours))+').';
    r.fix='The hourly check should pull it on its next run. If this is still red an hour from now: '+FIX;
  } else if(sameDay(ours, now)){
    r.lvl='ok'; r.msg='<b>Current.</b> Compiled '+esc(clock(ours))+' today.'+(fresh&&K.ok?' Last checked '+esc(clock(chk))+'.':'');
  } else if(fresh && K.ok){
    if(weekend){ r.lvl='ok'; r.msg='<b>Current.</b> Taylor\'s latest file is from '+esc(when(ours))+'. The county does not re-report on weekends.'; }
    else if(hr<8){ r.lvl='ok'; r.msg='<b>Current.</b> Today\'s file usually posts about 8 a.m.'; }
    else { r.lvl='wait'; r.msg='<b>Waiting on the state.</b> Today\'s file hasn\'t posted yet'+(hr>=11?', which is later than usual':'')+'. Last checked '+esc(clock(chk))+'.'; }
  } else {
    var why = !K ? 'the hourly check hasn\'t reported yet' : !K.ok ? 'the last hourly check couldn\'t reach the state\'s page' : 'the hourly check last ran '+when(chk);
    if(weekend || hr<8){ r.lvl='ok'; r.msg='<b>Current, as far as we can tell.</b> Showing the file from '+esc(when(ours))+'; '+esc(why)+'.'; }
    else if(hr<11){ r.lvl='wait'; r.msg='<b>Waiting.</b> Today\'s file isn\'t in yet ('+esc(why)+').'; }
    else { r.lvl='bad'; r.msg='<b>Not updated today.</b> Showing the file from '+esc(when(ours))+'; '+esc(why)+'.'; r.fix=FIX; }
  }
  if(!team) r.fix=null;
  return r;
}
function feedRow(L, Q){
  var r={name:'County live feed'}, t=null;
  if(FR.live){ t=new Date(Q.Summary.LastUpdatedTime);
    var m=mins(t);
    if(m<=30){ r.lvl='ok'; r.msg='<b>Live.</b> Updated '+esc(clock(t))+', '+esc(ago(t))+'.'; }
    else if(m<=180){ r.lvl='wait'; r.msg='<b>Slow.</b> The county\'s feed last refreshed '+esc(ago(t))+'. It normally refreshes every 10 minutes.'; }
    else { r.lvl='bad'; r.msg='<b>Stalled.</b> The county\'s feed hasn\'t refreshed since '+esc(when(t))+'.'; }
  } else {
    try{ t=new Date(L.tqv.Summary.LastUpdatedTime); }catch(e){}
    r.lvl='wait'; r.msg='<b>Couldn\'t reach the live feed.</b> Showing the copy saved '+esc(t&&!isNaN(t)?when(t):'earlier')+'. Refresh to try again.';
  }
  return r;
}
function fileRow(P){
  var r={name:'Daily voter files'}, now=new Date(), hr=now.getHours(), y=new Date(now); y.setDate(now.getDate()-1);
  var want=isoDay(now), need=[{k:'vbm_file',label:'mail-ballot file',f:'TAY_VBM_49894.txt'}];
  if(isoDay(now) >= '2026-10-25') need.push({k:'evl_file',label:'early-voting file',f:'TAY_EVL_49894.txt'});
  if(!P){ r.lvl='bad'; r.msg='<b>Couldn\'t load the precinct counts.</b> Refresh to try again.'; return r; }
  function fd(x){ if(!x) return ''; if(x.file_date) return x.file_date; if(!x.through) return ''; var t=ymd(x.through); t.setDate(t.getDate()+1); return isoDay(t); }
  var late=need.filter(function(n){ var f=fd(P[n.k]); return !f || f < want; });
  var counted=P.updated_at?new Date(P.updated_at):null;
  if(!late.length){ r.lvl='ok'; r.msg='<b>Current.</b> '+need.map(function(n){return 'The '+n.label+' is the state file of '+esc(nice(fd(P[n.k])));}).join('. ')+'.'+(counted?' Counted '+esc(when(counted))+'.':''); return r; }
  r.lvl = hr<11 ? 'wait' : 'bad';
  r.msg = '<b>'+(hr<11?'Today\'s file isn\'t uploaded yet.':'Today\'s file hasn\'t been uploaded.')+'</b> '+
    late.map(function(n){ var f=fd(P[n.k]); return 'The latest '+n.label+' '+(f?'is the state file of '+esc(nice(f)):'hasn\'t been uploaded at all'); }).join('. ')+'.';
  r.fix='Upload '+late.map(function(n){return n.f;}).join(' and ')+' to voterfiles/ in taylor-dec-ops, or use the Send to DEC button on the portal. The count runs by itself.';
  return r;
}
/* team: show the voter-file row and "Fix:" lines. noState: drop the state row
   (P13 numbers come from the voter files, not the state page). */
function freshBadge(team, noState){
  var L=FR.L; if(!L) return '';
  var rows=noState?[]:[stateRow(L, FR.K, team)];
  rows.push(feedRow(L, FR.Q));
  if(team) rows.push(fileRow(FR.P));
  var rank={ok:0,wait:1,bad:2}, worst=rows.reduce(function(a,r){return rank[r.lvl]>rank[a]?r.lvl:a;},'ok');
  var head={ok:'Everything on this page is current',wait:'Waiting on an update',bad:'Something on this page is behind'}[worst];
  return '<details class="fr"'+(worst!=='ok'?' open':'')+'><summary><span class="dot '+worst+'" aria-hidden="true"></span>'+head+'<span class="more">Details</span></summary><ul>'+
    rows.map(function(r){ return '<li><span class="dot '+r.lvl+'" aria-hidden="true"></span><span><b>'+esc(r.name)+':</b> '+r.msg.replace(/\.\./g,'.')+'</span>'+(r.fix?'<span class="fix">'+esc(r.fix)+'</span>':'')+'</li>'; }).join('')+
    '</ul></details>';
}

/* ---- live early votes (County Chase, Countywide Turnout) ---- */
function earlyNow(L, t){
  var e=t.early_voted||{}, st={D:e.D||0,R:e.R||0,NPA:e.NPA||0,T:e.T||0};
  var pt=null, at=null;
  try{ if(String(L.tqv.Summary.FvrsElectionNumber)===String(L.election_id)){ pt=L.tqv.Turnout.PartyType; at=new Date(L.tqv.Summary.LastUpdatedTime); } }catch(x){}
  if(!pt) return {live:false,n:st,st:st};
  var n={D:0,R:0,NPA:0,T:0};
  Object.keys(pt).forEach(function(k){ var v=+((pt[k]||{}).EarlyVoting)||0; n.T+=v;
    if(k==='DEM') n.D=v; else if(k==='REP') n.R=v; else if(k==='NPA') n.NPA=v; });
  if(n.T<st.T || n.D<st.D) return {live:false,n:st,st:st};
  return {live:true,n:n,st:st,at:(at&&!isNaN(at))?at:null};
}
function liveNote(EV){ return (EV.live && daysUntil('2026-10-24')<=0 && daysUntil('2026-11-03')>=0) ?
  ' In-person votes come from the elections office\'s running count, which updates through the day.' : ''; }
function mixLine(ret, asOf, early, EV, eday){
  if(!EV.live) return fmt(ret)+' by mail and '+fmt(early)+' early in person, through '+nice(asOf)+(eday?', plus '+fmt(eday)+' on Election Day so far':'')+'.'+evNote();
  return fmt(ret)+' by mail through '+nice(asOf)+', and '+fmt(early)+' early in person'+(eday?' and '+fmt(eday)+' on Election Day':'')+
    (EV.at?' as of '+when(EV.at):' so far')+'.'+liveNote(EV);
}
function liveChip(EV, asOf){
  var d=EV.live ? EV.n.D-EV.st.D : 0; if(d<=0) return '';
  var y=new Date(); y.setDate(y.getDate()-1);
  return '<span class="chip up">+'+fmt(d)+' early '+(asOf===isoDay(y)?'today':'since '+nice(asOf))+'</span>';
}

/* ---- daily turnout by party (County Chase only) ---- */
var DP_REG_FALLBACK={as_of:'2026-10-05',D:2826,R:7627,minor:314,NPA:982,T:11749};
var DP_SER=[{k:'D',label:'Democrats',color:'var(--navy)',shape:'circle'},
            {k:'R',label:'Republicans',color:'var(--red)',shape:'diamond',dash:'6 4'},
            {k:'O',label:'Everyone else',color:'var(--other)',shape:'square',dash:'2 3'}];
function dpKey(iso){ var p=iso.split('-'); return p[1]+'/'+p[2]+'/'+p[0]; }
function dpDays(L){
  var reg=L.registration||DP_REG_FALLBACK, den={D:reg.D, R:reg.R, O:(reg.minor||0)+(reg.NPA||0)};
  var out=[], dd=ymd(EV_START), end=ymd(EDAY), today=isoDay(new Date()), D=L.days;
  var loc=null, ped=null; try{ loc=L.tqv.Turnout.LocationDay.EarlyVoting; ped=L.tqv.Turnout.PartyType; }catch(e){}
  function grp(t,f){ var x=t[f]||{}; return {D:x.D||0, R:x.R||0, O:(x.O||0)+(x.NPA||0)}; }
  function diff(a,b){ return {D:Math.max(0,b.D-a.D), R:Math.max(0,b.R-a.R), O:Math.max(0,b.O-a.O)}; }
  var mail={}, st={};
  for(var i=1;i<D.length;i++){ var cov=prevDay(D[i].date);
    mail[cov]=diff(grp(D[i-1].taylor,'vbm_returned'), grp(D[i].taylor,'vbm_returned'));
    st[cov]=diff(grp(D[i-1].taylor,'early_voted'), grp(D[i].taylor,'early_voted')); }
  for(; dd<=end; dd.setDate(dd.getDate()+1)){
    var iso=isoDay(dd), inp=null;
    if(iso<=today){
      if(loc){ inp={D:0,R:0,O:0}; var k=dpKey(iso);
        Object.keys(loc).forEach(function(s){ var x=loc[s][k]||{};
          Object.keys(x).forEach(function(p){ var g=p==='DEM'?'D':p==='REP'?'R':'O'; inp[g]+=+x[p]||0; }); }); }
      else inp=st[iso]?{D:st[iso].D,R:st[iso].R,O:st[iso].O}:{D:0,R:0,O:0};
      if(iso===EDAY && ped) Object.keys(ped).forEach(function(p){
        var v=+((ped[p]||{}).ElectionDay)||0, g=p==='DEM'?'D':p==='REP'?'R':'O'; inp[g]+=v; });
    }
    var m=mail[iso]||null, r={d:iso, today:iso===today, future:iso>today, n:{}, pct:{}};
    DP_SER.forEach(function(sr){ var n=inp?(inp[sr.k]+(m?m[sr.k]:0)):null;
      r.n[sr.k]=n; r.pct[sr.k]=(n==null||!den[sr.k])?null:100*n/den[sr.k]; });
    out.push(r); }
  return {days:out, den:den, reg:reg};
}
function dpMark(sr, x, y, hollow){
  var a={fill:hollow?'var(--card)':sr.color, stroke:sr.color, 'stroke-width':2};
  if(sr.shape==='circle'){ a.cx=x; a.cy=y; a.r=4.5; return el('circle',a); }
  a.x=x-4; a.y=y-4; a.width=8; a.height=8;
  if(sr.shape==='diamond') a.transform='rotate(45 '+x+' '+y+')';
  return el('rect',a);
}
function dpSwatch(sr){
  var m=sr.shape==='circle'?'<circle cx="13" cy="6" r="4" fill="'+sr.color+'"/>':
        '<rect x="9" y="2" width="8" height="8" fill="'+sr.color+'"'+(sr.shape==='diamond'?' transform="rotate(45 13 6)"':'')+'/>';
  return '<svg viewBox="0 0 26 12" aria-hidden="true"><line x1="0" x2="26" y1="6" y2="6" stroke="'+sr.color+'" stroke-width="2.5"'+
    (sr.dash?' stroke-dasharray="'+sr.dash+'"':'')+'/>'+m+'</svg>';
}
function dayPartySection(L){
  var X=dpDays(L), done=X.days.filter(function(r){return !r.future;});
  var rows=done.slice().reverse().map(function(r){
    return '<tr><td>'+nice(r.d)+(r.today?' (so far)':'')+'</td>'+DP_SER.map(function(sr){
      return '<td>'+(r.pct[sr.k]==null?'&ndash;':r.pct[sr.k].toFixed(1)+'%')+' <small>('+fmt(r.n[sr.k])+')</small></td>'; }).join('')+'</tr>'; }).join('');
  return '<div class="sec">Turnout by party, day by day</div><div class="card">'+
    '<p class="cap">Share of each group&rsquo;s registered voters who voted that day, in person or by a mail ballot received that day. '+
    'Each party is divided by its own registration, so the lines compare fairly in a county registered '+(X.den.R/X.den.D).toFixed(1)+' Republicans to every Democrat.</p>'+
    '<div class="dlg">'+DP_SER.map(function(sr){ return '<span>'+dpSwatch(sr)+esc(sr.label)+' ('+fmt(X.den[sr.k])+' registered)</span>'; }).join('')+'</div>'+
    '<svg id="tdsb-a-days" role="img" aria-label="Share of Democrats, Republicans and everyone else voting each day, October 24 to November 3"></svg>'+
    '<details><summary>Show as a table</summary><table><thead><tr><th>Day</th>'+
    DP_SER.map(function(sr){return '<th>'+esc(sr.label)+'</th>';}).join('')+'</tr></thead><tbody>'+rows+'</tbody></table></details>'+
    '<div class="sub">In person from the elections office&rsquo;s running count, so today updates through the day. '+
    'Mail ballots are added the next morning from the state report, so today&rsquo;s point is in person only (hollow marker). '+
    'Registration: Florida Department of State, active voters as of '+esc(nice(X.reg.as_of))+'. Everyone else is no party plus minor parties.</div></div>';
}
function dayPartyChart(id, L){
  var svg=document.getElementById(id); if(!svg) return; svg.innerHTML='';
  var X=dpDays(L), days=X.days, W=widthOf(svg), H=230, Lm=40, R=14, T=16, B=40, n=days.length;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  var top=0; days.forEach(function(r){ DP_SER.forEach(function(sr){ if(r.pct[sr.k]!=null) top=Math.max(top,r.pct[sr.k]); }); });
  var step=top<=2?0.5:top<=5?1:top<=10?2:5, hi=Math.max(step*2, Math.ceil(top/step)*step);
  var Y=function(v){return T+(1-v/hi)*(H-T-B);}, slot=(W-Lm-R)/n, Xc=function(i){return Lm+i*slot+slot/2;};
  for(var v=0; v<=hi+1e-9; v+=step){ var y=Y(v);
    svg.appendChild(el('line',{x1:Lm,x2:W-R,y1:y,y2:y,stroke:'var(--line)','stroke-width':1}));
    svg.appendChild(txt(Lm-6,y+4,(Math.round(v*10)/10)+'%',{anchor:'end',size:11})); }
  var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  days.forEach(function(r,i){ var dt=ymd(r.d), ed=r.d===EDAY, c=ed?'var(--red)':r.today?'var(--ink)':'var(--ink3)', w=(ed||r.today)?700:500;
    svg.appendChild(txt(Xc(i),H-22,WD[dt.getDay()],{anchor:'middle',size:11,weight:w,fill:c}));
    svg.appendChild(txt(Xc(i),H-8,ed?'Nov 3':((dt.getDate()===1||i===0)?nice(r.d):String(dt.getDate())),{anchor:'middle',size:11,weight:w,fill:c})); });
  DP_SER.slice().reverse().forEach(function(sr){
    var pts=[]; days.forEach(function(r,i){ if(r.pct[sr.k]!=null) pts.push({i:i,v:r.pct[sr.k],today:r.today}); });
    if(!pts.length) return;
    var a={d:pts.map(function(p,j){return (j?'L':'M')+Xc(p.i).toFixed(1)+' '+Y(p.v).toFixed(1);}).join(' '),
           fill:'none',stroke:sr.color,'stroke-width':2.5,'stroke-linejoin':'round','stroke-linecap':'round'};
    if(sr.dash) a['stroke-dasharray']=sr.dash;
    svg.appendChild(el('path',a));
    pts.forEach(function(p){ svg.appendChild(dpMark(sr, Xc(p.i), Y(p.v), p.today)); });
  });
  days.forEach(function(r,i){
    var hit=el('rect',{x:Lm+i*slot,y:T,width:slot,height:H-T-B,fill:'transparent'});
    hit.addEventListener('mousemove',function(e){
      var lab='<b>'+(r.d===EDAY?'Election Day, ':'')+ymd(r.d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+(r.today?' (so far)':'')+'</b>';
      tipAt(svg, r.future ? lab+' &middot; still to come' :
        lab+DP_SER.map(function(sr){ return ' &middot; '+sr.label.split(' ')[0]+' '+r.pct[sr.k].toFixed(1)+'% ('+fmt(r.n[sr.k])+')'; }).join(''), e); });
    hit.addEventListener('mouseleave',tipOff); svg.appendChild(hit); });
}

            :'Counts start with the first daily file.')+

  h+='<div class="grid">';
  h+='<div class="card"><h3>Before Election Day</h3><p class="cap">Mail ballots and early votes, counted once each.</p>'+
     meter('Cast before Election Day', before, G.b_before, 'Most of these come once early voting opens Oct 24.', status(before,G.b_before,'2026-11-02','2026-10-24','pace check from Oct 24'))+
     (me&&me.dem_active&&total>0?'<div class="mrow"><div class="sub">'+fmt(total)+' is '+(100*total/me.dem_active).toFixed(1)+'% of Precinct 13\'s '+fmt(me.dem_active)+' active Democrats. '+fmt(G.b_ballots)+' would be '+Math.round(100*G.b_ballots/me.dem_active)+'%.</div></div>':'')+
     '</div>';

       return {p:p,n:x.cast_before_eday||0,rate:x.dem_active?x.cast_before_eday/x.dem_active:null};}) : [];
  var allRates = rows.length && rows.every(function(r){return r.rate!=null;});
  rows.sort(function(a,b){return allRates?b.rate-a.rate:b.n-a.n;});
  if(showRace) h+='<div class="card"><h3>The five big precincts</h3><p class="cap">Democratic ballots cast before Election Day'+(allRates?', as a share of each precinct\'s active Democrats':'')+'. Goal: Precinct 13 on top.</p>'+
     (rows.length?'<svg id="tdsb-race" role="img" aria-label="Democratic ballots by precinct"></svg>':'<div class="sub">Starts with the first daily file.</div>')+'</div>';
  if(!members) h+=whenWhere();
  if(members){
    h+='<div class="card"><h3>Mail ballots in 13</h3><p class="cap">From the DS-DE 145 file.</p>'+
       (me?meter('Active requests', me.mail_active, null, null)+meter('Still to chase', me.mail_outstanding_chase, null, 'Sent, not back, and not already voted early.')
          :'<div class="sub">Starts with the first daily file.</div>')+
       cureMeter(S,'b_rejected','b_cured','Mail ballots needing a cure',me)+'</div>';
    h+='<div class="card"><h3>Grant B goals</h3><p class="cap">Hand counts from the scoreboard sheet.</p>'+
       (S? ['b_doors','b_postcards','b_ptv_cards','b_drivers','b_canvassers','b_regs','b_rides'].map(function(k){return sheetMeter(S,k);}).join('')
         : '<div class="sub">Hand counts are not connected yet.</div>')+'</div>';
  }
  h+='</div>';
  if(members && P && P.history && P.history.length>1)
    h+='<div class="sec">Precinct 13, day by day</div><div class="card"><p class="cap">Cast before Election Day, with the goal of '+fmt(G.b_before)+' marked. Expect the line to climb fast once early voting opens Oct 24.</p><svg id="tdsb-b-pace" role="img" aria-label="Precinct 13 ballots over time"></svg></div>';
  h+=foot(L,P,S,!members);
  root.innerHTML=h;
  if(showRace && rows.length) raceChart('tdsb-race', rows, allRates);
  if(members && P && P.history && P.history.length>1)
    paceChart('tdsb-b-pace', P.history.map(function(x){return {d:x.date,v:x.p13};}), G.b_before, P.history[0].date, '2026-11-02', 'ballots', true);
  animateIn();
}

function foot(L,P,S,pub){
  var d=L&&L.days[L.days.length-1];
  return '<p class="foot">Updated: '+(P?'state file of '+esc(nice(fileDay(P)))+' (precinct counts)'+(d?', ':''):'')+(d?esc(d.compiled)+' (state totals)':'')+'. '+
    (pub?'Counts only. No voter is identified.':'')+'</p>'+
    '<details><summary>Where these numbers come from</summary>'+
    '<p><b>County totals:</b> Florida Department of State, <a href="https://countyfilesvbm-ev.floridados.gov/VoteByMailEarlyVotingReports/PublicStats">county vote-by-mail and early voting report</a> (election 49894). Published each morning and covers through the day before.</p>'+
    '<p><b>Precinct counts:</b> the state\'s daily mail-ballot and early-vote files for Taylor County, counted by the DEC. Only totals are published. A voter who appears in both files is counted once.</p>'+
    '<p><b>Early votes and Election Day:</b> the Supervisor of Elections\' <a href="https://tqv.vrswebapps.com/?state=FL&amp;county=TAY&amp;election=85">live turnout feed</a>, which updates through the day. The state report counts early votes a day later, so this page uses the county\'s number whenever it is the more current one.</p>'+
    (pub?'':'<p><b>Hand counts:</b> the DEC scoreboard sheet, entered by the chair.</p>')+
    '</details>';
}

function boot(){
  Promise.all([
    raw(DATA+'latest.json').then(JSON.parse),
    soft(DATA+'p13.json', JSON.parse),
    MODE==='p13pub' ? Promise.resolve(null) : soft(SHEET, csv),
    soft(DATA+'state_check.json', JSON.parse),
    soft(TQV_LIVE, JSON.parse)
  ]).then(function(r){
    FR={L:r[0],P:r[1],K:r[3],Q:r[4]}; liveTqv(r[0], r[4]);
    if(MODE==='a') grantA(r[0],r[1],r[2]);
    else p13(r[0],r[1],r[2],MODE==='p13mem');
  }).catch(function(e){
    clog('scoreboard: load failed',String(e));
    root.innerHTML='<div class="hd"><h2>Couldn\'t load today\'s figures</h2><p>Try refreshing. The data lives at '+
      '<a href="'+DATA+'latest.json">the scoreboard data file</a>.</p></div>';
  });
}
var tm; window.addEventListener('resize',function(){clearTimeout(tm);tm=setTimeout(boot,250);});
try{ boot(); }catch(e){ clog('scoreboard: boot error',String(e)); }
})();
</script>
